# SennaGuard em https://<servidor>/sennaguard/ (o site :80 do NOC já redireciona para HTTPS)
RedirectMatch 301 ^/sennaguard$ /sennaguard/
<Location /sennaguard/>
    ProxyPass http://127.0.0.1:8010/
    ProxyPassReverse http://127.0.0.1:8010/
    ProxyPassReverseCookiePath / /sennaguard/
    RequestHeader set X-Forwarded-Proto "https"
    # 'unsafe-inline' só em style-src: os diálogos (Radix) injetam <style>. Scripts só do próprio servidor
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # Limite de corpo de requisição no proxy (anexos de até 5 MB + margem)
    LimitRequestBody 6291456
</Location>
# Tempo real (SSE), depois do bloco geral para valer sobre ele: sem buffer, senão os avisos chegam atrasados ao navegador
<Location /sennaguard/api/eventos>
    ProxyPass http://127.0.0.1:8010/api/eventos flushpackets=on timeout=3600
    SetEnv no-gzip 1
</Location>
