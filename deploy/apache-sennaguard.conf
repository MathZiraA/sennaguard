# SennaGuard em https://<servidor>/sennaguard/ (o site :80 do NOC já redireciona para HTTPS)
RedirectMatch 301 ^/sennaguard$ /sennaguard/
<Location /sennaguard/>
    ProxyPass http://127.0.0.1:8010/
    ProxyPassReverse http://127.0.0.1:8010/
    ProxyPassReverseCookiePath / /sennaguard/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
</Location>
